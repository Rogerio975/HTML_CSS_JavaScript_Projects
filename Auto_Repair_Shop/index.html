<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficina Mecânica - Gestão de Veículos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">&#9881;</span>
      <div>
        <h1>Oficina Mecânica</h1>
        <p>Controle de veículos e serviços</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="statTotal">0</span>
        <span class="stat-label">Veículos</span>
      </div>
      <div class="stat">
        <span class="stat-value pending" id="statPendentes">0</span>
        <span class="stat-label">Pendentes</span>
      </div>
      <div class="stat">
        <span class="stat-value done" id="statConcluidos">0</span>
        <span class="stat-label">Concluídos</span>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="card form-card">
      <h2 id="formTitle">Cadastrar veículo</h2>
      <form id="veiculoForm" novalidate>
        <input type="hidden" id="veiculoId">

        <div class="grid">
          <div class="field">
            <label for="marca">Marca</label>
            <input type="text" id="marca" placeholder="Ex.: Volkswagen" maxlength="40" required>
            <small class="error" id="erro-marca"></small>
          </div>

          <div class="field">
            <label for="modelo">Modelo</label>
            <input type="text" id="modelo" placeholder="Ex.: Gol 1.6" maxlength="40" required>
            <small class="error" id="erro-modelo"></small>
          </div>

          <div class="field">
            <label for="ano">Ano/Modelo</label>
            <input type="number" id="ano" placeholder="Ex.: 2018" min="1900" required>
            <small class="error" id="erro-ano"></small>
          </div>

          <div class="field">
            <label for="cor">Cor</label>
            <input type="text" id="cor" placeholder="Ex.: Prata" maxlength="30" required>
            <small class="error" id="erro-cor"></small>
          </div>

          <div class="field">
            <label for="placa">Placa</label>
            <input type="text" id="placa" placeholder="Ex.: ABC1D23" maxlength="8" required>
            <small class="error" id="erro-placa"></small>
          </div>

          <div class="field">
            <label for="quilometragem">Quilometragem (km)</label>
            <input type="number" id="quilometragem" placeholder="Ex.: 85000" min="0" step="1" required>
            <small class="error" id="erro-quilometragem"></small>
          </div>

          <div class="field span-2">
            <label for="tipoPessoa">Tipo de pessoa</label>
            <select id="tipoPessoa">
              <option value="fisica">Pessoa Física</option>
              <option value="juridica">Pessoa Jurídica</option>
            </select>
          </div>

          <div class="field" id="campoCpf">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="Ex.: 000.000.000-00" maxlength="14" inputmode="numeric" required>
            <small class="error" id="erro-cpf"></small>
          </div>

          <div class="field" id="campoCnpj" hidden>
            <label for="cnpj">CNPJ</label>
            <input type="text" id="cnpj" placeholder="Ex.: 00.000.000/0000-00" maxlength="18" inputmode="numeric" disabled>
            <small class="error" id="erro-cnpj"></small>
          </div>

          <div class="field span-2">
            <label for="dono">Dono ou Empresa</label>
            <input type="text" id="dono" placeholder="Nome completo do proprietário ou empresa" maxlength="80" required>
            <small class="error" id="erro-dono"></small>
          </div>

          <div class="field span-2">
            <label for="servicoRealizado">Serviço realizado</label>
            <textarea id="servicoRealizado" rows="3" placeholder="Ex.: Troca de óleo e filtro, alinhamento e balanceamento" maxlength="500"></textarea>
          </div>

          <div class="field">
            <label for="valorServico">Valor do serviço (R$)</label>
            <input type="number" id="valorServico" placeholder="Ex.: 250,00" min="0" step="0.01" required>
            <small class="error" id="erro-valorServico"></small>
          </div>

          <div class="field span-2">
            <label for="precisaFazer">O que precisa fazer</label>
            <textarea id="precisaFazer" rows="3" placeholder="Ex.: Trocar pastilhas de freio dianteiras, revisar suspensão" maxlength="500"></textarea>
          </div>

          <div class="field">
            <label for="status">Status</label>
            <select id="status">
              <option value="pendente">Pendente</option>
              <option value="andamento">Em andamento</option>
              <option value="concluido">Concluído</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn primary" id="btnSalvar">Salvar veículo</button>
          <button type="button" class="btn ghost" id="btnCancelar" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="card list-card">
      <div class="list-header">
        <h2>Veículos cadastrados</h2>
        <div class="filters">
          <input type="search" id="busca" placeholder="Buscar por marca, modelo, dono...">
          <select id="filtroStatus" aria-label="Filtrar por status">
            <option value="todos">Todos os status</option>
            <option value="pendente">Pendente</option>
            <option value="andamento">Em andamento</option>
            <option value="concluido">Concluído</option>
          </select>
        </div>
      </div>

      <div id="lista" class="lista" aria-live="polite"></div>
    </section>
  </main>

  <section id="ordemImpressao" class="ordem-impressao" aria-hidden="true"></section>

  <footer class="footer">
    Sistema de Oficina Mecânica &middot; Os dados ficam salvos neste navegador
  </footer>

  <script>
    const tipoPessoa = document.getElementById('tipoPessoa');
    const campoCpf = document.getElementById('campoCpf');
    const campoCnpj = document.getElementById('campoCnpj');
    const cpf = document.getElementById('cpf');
    const cnpj = document.getElementById('cnpj');

    tipoPessoa.addEventListener('change', () => {
      const pessoaFisica = tipoPessoa.value === 'fisica';
      campoCpf.hidden = !pessoaFisica;
      campoCnpj.hidden = pessoaFisica;
      cpf.disabled = !pessoaFisica;
      cpf.required = pessoaFisica;
      cnpj.disabled = pessoaFisica;
      cnpj.required = !pessoaFisica;
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
